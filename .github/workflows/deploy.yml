name: Build and Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "infra/**"
      - "**.md"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-aks-deploy-example-dev
  AKS_CLUSTER: aks-aks-deploy-example-dev
  IMAGE_NAME: nextjs-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve ACR name
        id: acr
        run: |
          NAME=$(az acr list --resource-group "$RESOURCE_GROUP" --query "[0].name" -o tsv)
          LOGIN_SERVER=$(az acr list --resource-group "$RESOURCE_GROUP" --query "[0].loginServer" -o tsv)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "login_server=$LOGIN_SERVER" >> "$GITHUB_OUTPUT"

      - name: Docker login to ACR
        run: az acr login --name "${{ steps.acr.outputs.name }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_CLUSTER" \
            --overwrite-existing

      - name: Deploy to AKS
        run: |
          cd k8s
          kubectl apply -k .
          kubectl set image deployment/nextjs-app \
            nextjs-app="${{ steps.acr.outputs.login_server }}/$IMAGE_NAME:${{ github.sha }}" \
            -n aks-deploy-example
          kubectl rollout status deployment/nextjs-app -n aks-deploy-example --timeout=180s

      - name: Print live URL
        run: |
          echo "Waiting for LoadBalancer public IP..."
          for i in $(seq 1 30); do
            IP=$(kubectl get svc nextjs-app -n aks-deploy-example -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            [ -n "$IP" ] && break
            sleep 10
          done
          if [ -n "$IP" ]; then
            echo "App is live at: http://$IP" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "LoadBalancer IP not yet assigned, check with: kubectl get svc -n aks-deploy-example" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
